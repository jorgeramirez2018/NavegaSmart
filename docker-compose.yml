# Base de datos PostgreSQL para desarrollo local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: navegasmart-db
    environment:
      POSTGRES_DB: navegasmart
      POSTGRES_USER: navegasmart
      POSTGRES_PASSWORD: navegasmart
    ports:
      - "5432:5432"
    volumes:
      - navegasmart-data:/var/lib/postgresql/data

volumes:
  navegasmart-data:
