server:
  port: 8080

spring:
  application:
    name: navegasmart
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/navegasmart}
    username: ${DB_USER:navegasmart}
    password: ${DB_PASSWORD:navegasmart}
  jpa:
    # El esquema lo gestiona Flyway (db/migration), Hibernate no lo modifica.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

navegasmart:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  auth:
    # Clave para firmar los tokens JWT (mínimo 32 caracteres). En producción, definir JWT_SECRET.
    jwt-secret: ${JWT_SECRET:navegasmart-clave-de-desarrollo-cambiar-en-produccion}
    token-validity: ${TOKEN_VALIDITY:8h}
    # Usuario creado al arrancar si no existe ninguno (útil para la demostración).
    demo-user:
      enabled: ${DEMO_USER_ENABLED:true}
      username: demo
      password: demo1234

logging:
  level:
    com.navegasmart: INFO
